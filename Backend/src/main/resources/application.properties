spring.application.name=pmap

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/pmap_db
spring.datasource.username=postgres
spring.datasource.password=12345
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=ChangeThisSecretToALongRandomValueChangeThisSecretToALongRandomValue
jwt.expiration-ms=86400000

springdoc.swagger-ui.path=/swagger-ui.html

# Origenes permitidos para CORS, separados por coma.
# En produccion se sobreescribe con la variable APP_CORS_ALLOWED_ORIGINS
# (p. ej. https://pmap-frontend.vercel.app)
app.cors.allowed-origins=http://localhost:5173
